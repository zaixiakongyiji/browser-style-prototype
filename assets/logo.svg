  <!-- Browser Window Top Bar -->
  <path d="M29 68 H227" stroke="#334155" stroke-width="4" />
  <circle cx="54" cy="49" r="6" fill="#F87171" />
  <circle cx="74" cy="49" r="6" fill="#FBBF24" />
  <circle cx="94" cy="49" r="6" fill="#4ADE80" />
  <rect x="114" y="42" width="88" height="14" rx="7" fill="#334155" />

  <!-- Prototype Layout Grid Inside Browser -->
  <!-- Left Sidebar Block -->
