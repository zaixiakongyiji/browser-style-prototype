  <!-- Top Hero Card with CSS Sliders -->
  <rect x="114" y="88" width="94" height="54" rx="10" fill="#334155" fill-opacity="0.6" stroke="#818CF8" stroke-width="3" />
  <line x1="128" y1="106" x2="194" y2="106" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
